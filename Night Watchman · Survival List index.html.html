<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>守夜人 · 生存清单</title>
<style>
:root{color-scheme:dark;--bg:#120e0a;--paper:#d9c7a0;--paper2:#b9a273;--ink:#2a1d10;--glow:#ff9a3c;--red:#a8321f;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 100%,#3b1f0c 0,var(--bg) 62%) fixed,var(--bg);color:var(--paper);font-family:"STKaiti","Kaiti SC","Songti SC",Georgia,serif}
#app{max-width:480px;margin:0 auto;padding:10px 14px 190px}
.sw{animation:up .3s}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.scene{display:flex;justify-content:center;align-items:flex-end;gap:6px;height:140px;border-bottom:3px solid #000;margin-bottom:12px}
.ch{height:130px;width:auto;max-width:130px;object-fit:contain}
.fire{width:46px;height:60px;animation:fl .35s infinite alternate;transform-origin:50% 100%;filter:drop-shadow(0 0 16px var(--glow))}
@keyframes fl{from{transform:scale(1,.92) rotate(-2deg)}to{transform:scale(.94,1.06) rotate(2deg)}}
.card{background:linear-gradient(160deg,var(--paper),var(--paper2));color:var(--ink);border:3px solid #000;border-radius:6px 14px 8px 12px;box-shadow:3px 4px 0 #000,inset 0 0 20px rgba(70,40,10,.4);padding:12px 14px;margin-bottom:12px}
.big{font-size:34px;font-weight:700;text-align:center;line-height:1.1}
.sub{text-align:center;font-size:15px;margin-top:4px}.sub b{color:var(--red);font-size:19px}
.rope{height:14px;border:3px solid #000;border-radius:8px;background:#5b4326;margin:10px 0 4px;overflow:hidden}
.rope i{display:block;height:100%;background:repeating-linear-gradient(135deg,#c9a14e 0 6px,#8c6a2c 6px 12px);transition:width .6s}
.row{display:flex;justify-content:space-between;align-items:center;font-size:13px;gap:8px}
button{font:inherit;color:var(--paper);background:#1d140d;border:3px solid #000;border-radius:8px 12px 6px 10px;box-shadow:2px 3px 0 #000;padding:8px 12px;font-size:15px;transition:transform .12s,box-shadow .12s}
button:active{transform:translate(2px,2px);box-shadow:0 0 0 #000}
.go{background:var(--red);color:#fbe9c4;font-size:16px;white-space:nowrap}
.ban{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px}
h3{margin:14px 2px 6px;font-size:14px;letter-spacing:.15em;color:var(--paper2);font-weight:400;display:flex;justify-content:space-between}
.t{display:flex;align-items:center;gap:10px;background:var(--paper);color:var(--ink);border:2.5px solid #000;border-radius:6px 12px 6px 10px;box-shadow:2px 3px 0 #000;padding:9px 10px;margin-bottom:8px;transition:opacity .3s,background .3s}
.t.s{margin-left:26px;padding:6px 10px;font-size:14px;background:var(--paper2)}
.t.fl{animation:up .3s}
.cb{flex:none;width:28px;height:28px;padding:0;border-radius:50%;background:#efe3c4;border:3px solid #000;box-shadow:none;position:relative}
.d .cb{background:var(--red)}.d .cb:after{content:"✔";position:absolute;inset:0;color:#fbe9c4;font-size:15px;line-height:22px;text-align:center}
.fl.d .cb{animation:pop .35s}@keyframes pop{50%{transform:scale(1.35)}}
.tx{flex:1;font-size:16px;line-height:1.3;word-break:break-all}.d{opacity:.55}.d .tx{text-decoration:line-through}
.pp{margin-left:6px;font-size:13px}.p1{color:#5a7a2a}.p2{color:#c26a12}.p3{color:#b3201a}
.mn{flex:none;padding:2px 8px;font-size:16px;background:none;color:var(--ink);border:0;box-shadow:none;opacity:.55}
.empty{text-align:center;opacity:.7;padding:30px 10px;font-size:14px;line-height:1.7}
#bar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));background:rgba(18,14,10,.94);border-top:3px solid #000;padding:8px 12px;display:flex;gap:6px;align-items:center;max-width:480px;margin:0 auto}
#bar input{flex:1;min-width:0}
#bar button{padding:7px 9px;font-size:14px}
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;max-width:480px;margin:0 auto;background:#0d0906;border-top:3px solid #000;padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs button{flex:1;border:0;border-radius:0;box-shadow:none;background:none;padding:14px 0;font-size:16px;opacity:.55}
#tabs button.on{opacity:1;color:var(--glow)}
input,select{font:inherit;font-size:16px;padding:7px 9px;background:#efe3c4;color:var(--ink);border:2.5px solid #000;border-radius:4px;width:100%}
label{display:block;font-size:13px;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:8px}
.grid i{aspect-ratio:1;border:2px solid #000;border-radius:3px;background:#8c7a56}.grid i.on{background:var(--glow);box-shadow:0 0 6px var(--glow)}
.slot{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px}.slot span{width:80px}.slot input{padding:3px;font-size:12px}
.hint{font-size:12px;line-height:1.7;opacity:.8;margin-top:8px}
#pop{position:fixed;inset:0;z-index:9;display:none;background:radial-gradient(ellipse at 50% 100%,rgba(255,120,40,.3),rgba(0,0,0,.93) 70%);flex-direction:column;align-items:center;justify-content:flex-end;padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px))}
#pop.on{display:flex}
#pa .ch{height:42vh;max-height:340px;max-width:80vw;animation:rise .7s cubic-bezier(.2,1.4,.4,1)}
@keyframes rise{from{transform:translateY(60%);opacity:0}to{transform:none;opacity:1}}
#pop .card{max-width:380px;width:100%;margin-top:10px}#say{margin:0;font-size:18px;line-height:1.6}
.pb{display:flex;gap:10px;max-width:380px;width:100%}.pb button{flex:1;font-size:18px;padding:12px}
.b0{--idle:i0;--cheer:ch0;--d:.55s;--enter:rise}.b1{--idle:i1;--cheer:ch1;--d:3s;--enter:inL}.b2{--idle:i2;--cheer:ch2;--d:.9s;--enter:drop}.b3{--idle:i3;--cheer:ch3;--d:.4s;--enter:inR}.b4{--idle:i4;--cheer:ch4;--d:1.3s;--enter:inL}.b5{--idle:i5;--cheer:ch5;--d:1.1s;--enter:inB}
.ch{height:auto;width:auto;max-width:180px;max-height:165px;object-fit:contain;transform:scaleX(var(--fx,1));transform-origin:50% 100%;animation:var(--idle) var(--d) ease-in-out infinite;user-select:none;-webkit-user-drag:none}
@keyframes i0{0%,100%{translate:0 0;rotate:-2deg}50%{translate:0 -7px;rotate:2deg}}
@keyframes i1{0%,100%{rotate:-2deg;scale:1 1}50%{rotate:2deg;scale:1 1.02}}
@keyframes i2{0%,100%{translate:-4px 0;rotate:-1.5deg}50%{translate:4px 0;rotate:1.5deg}}
@keyframes i3{0%,100%{translate:0 0;rotate:-3deg}50%{translate:0 -10px;rotate:3deg}}
@keyframes i4{0%,100%{rotate:-3deg;scale:1 .98}50%{rotate:3deg;scale:1 1.03}}
@keyframes i5{0%,100%{translate:0 0;rotate:0deg;scale:1}40%{translate:-10px 0;rotate:-4deg;scale:1.05}60%{translate:6px 0;rotate:2deg}}
@keyframes ch0{35%{translate:0 -34px;rotate:200deg}70%{translate:0 -8px;rotate:350deg}100%{translate:0 0;rotate:360deg}}
@keyframes ch1{25%{translate:0 -26px}50%{translate:0 0}75%{translate:0 -18px}100%{translate:0 0}}
@keyframes ch2{30%,60%{rotate:-14deg;scale:1.08}100%{rotate:0deg;scale:1}}
@keyframes ch3{35%{translate:70px 0;rotate:-6deg}100%{translate:0 0}}
@keyframes ch4{25%{rotate:-18deg;scale:1.1}50%{rotate:18deg}75%{rotate:-10deg}100%{rotate:0deg}}
@keyframes ch5{25%{scale:1.2 .85}50%{scale:.9 1.15;translate:12px -10px}75%{scale:1.15 .9}100%{scale:1;translate:0 0}}
@keyframes nod{40%{translate:0 6px;scale:1.05 .93}}
@keyframes sad{0%,100%{rotate:-5deg;translate:0 3px;scale:1 .97}50%{rotate:-2deg;translate:0 5px;scale:1 .94}}
@keyframes rise{from{translate:0 60%;opacity:0}to{translate:0 0;opacity:1}}
@keyframes inL{from{translate:-70vw -10%;rotate:-12deg;opacity:0}to{translate:0 0;opacity:1}}
@keyframes inR{from{translate:90vw 0;rotate:-8deg}to{translate:0 0}}
@keyframes drop{from{translate:0 -140%;opacity:0}60%{translate:0 6%;opacity:1}to{translate:0 0}}
@keyframes inB{from{translate:0 40%;scale:.2;opacity:0}60%{scale:1.2;opacity:1}to{scale:1}}
.cheer .ch{animation:var(--cheer) .85s,var(--idle) var(--d) .85s ease-in-out infinite}
.nod .ch{animation:nod .45s,var(--idle) var(--d) .45s ease-in-out infinite}
.sad .ch{animation:sad 2.4s ease-in-out infinite;filter:brightness(.78) saturate(.85)}
.happy .ch{animation-duration:calc(var(--d)*.6)}
#pa .ch{height:auto;width:auto;max-height:40vh;max-width:84vw;filter:drop-shadow(0 0 18px rgba(255,150,50,.35));animation:var(--enter) .85s cubic-bezier(.2,1.3,.4,1),var(--idle) var(--d) .85s ease-in-out infinite}
.scene{height:auto;min-height:190px;gap:8px;padding:0 4px 6px;justify-content:space-between;align-items:flex-end}
.buddy{position:relative;cursor:pointer;flex:none;max-width:58%}
.bub{flex:1;min-width:0;align-self:center;margin-bottom:46px;position:relative;background:var(--paper);color:var(--ink);border:3px solid #000;border-radius:14px;padding:8px 10px;font-size:14px;line-height:1.5;box-shadow:2px 3px 0 #000;animation:up .4s}
.bub:before,.bub:after{content:"";position:absolute;left:-13px;bottom:16px;border:8px solid transparent;border-left:0;border-right-color:#000}
.bub:after{left:-8px;border-right-color:var(--paper)}
.sp{position:absolute;top:25%;left:50%;font-style:normal;pointer-events:none;animation:spk .9s var(--d) both}
@keyframes spk{0%{opacity:0;translate:0 0;scale:.4}30%{opacity:1}100%{opacity:0;translate:var(--x) -80px;scale:1.2}}
</style></head><body>
<div id="app"></div>
<div id="bar"><button id="bp">○</button><button id="bl">🔥</button><button id="br">·</button><button id="bc" style="display:none"></button><input id="ti" placeholder="写下一件要做的事…" maxlength="60"><button class="go" id="ba">＋</button></div>
<nav id="tabs"><button data-t="0" class="on">🔥 今日</button><button data-t="1">⛺ 营地</button></nav>
<div id="pop"><div id="pa"></div><div class="card"><p id="say"></p></div><div class="pb"><button class="go" id="p1"></button><button id="p2"></button></div></div>

/* 音效（Web Audio 现场合成，原创） */
let AC;const ac=()=>{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();return AC};
function note(f,t,d,ty,v){const a=ac(),o=a.createOscillator(),g=a.createGain();o.type=ty;o.frequency.value=f;o.connect(g);g.connect(a.destination);const s=a.currentTime+t;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+d);o.start(s);o.stop(s+d+.05)}
const tok=()=>{try{note(180,0,.15,"triangle",.3);note(120,.04,.2,"triangle",.2)}catch(e){}};
function gl(f0,f1,d,ty,v,vib){const a=ac(),t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type=ty;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);if(vib){const l=a.createOscillator(),lg=a.createGain();l.frequency.value=vib;lg.gain.value=f0*.06;l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(t+d)}o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d+.05)}
function voice(i){try{[()=>{gl(900,1300,.12,"sine",.25);setTimeout(()=>gl(1100,1500,.12,"sine",.25),140)},()=>gl(520,780,.55,"sine",.22,7),()=>gl(150,105,.45,"triangle",.4),()=>{note(196,0,.18,"sawtooth",.16);note(294,.16,.3,"sawtooth",.16);[.4,.52,.64,.76].forEach(t=>note(90,t,.08,"triangle",.3))},()=>gl(330,240,.5,"sawtooth",.14,12),()=>growl()][i]()}catch(e){}}
function chime(i,morning){try{voice(i);setTimeout(()=>{try{const m=morning?[261.6,329.6,392,523.3]:[220,261.6,311.1,293.7,220];m.forEach((f,k)=>note(f,k*.26,1,morning?"sine":"triangle",.22));if(!morning)note(55,0,2.2,"sawtooth",.06)}catch(e){}},500)}catch(e){}}
function growl(){try{const a=ac(),t=a.currentTime,o=a.createOscillator(),f=a.createBiquadFilter(),g=a.createGain();o.type="sawtooth";o.frequency.setValueAtTime(90,t);o.frequency.exponentialRampToValueAtTime(40,t+1.3);f.type="lowpass";f.frequency.setValueAtTime(700,t);f.frequency.exponentialRampToValueAtTime(100,t+1.3);o.connect(f);f.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.4,t);g.gain.exponentialRampToValueAtTime(.001,t+1.5);o.start();o.stop(t+1.6)}catch(e){}}
function crackle(){try{const a=ac(),n=a.sampleRate*1.4,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let k=0;k<n;k++)d[k]=(Math.random()<.004?1:Math.random()*.15)*(1-k/n)*(Math.random()*2-1);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();f.type="bandpass";f.frequency.value=1800;g.gain.value=1.4;s.buffer=b;s.connect(f);f.connect(g);g.connect(a.destination);s.start()}catch(e){}}

/* 数据 */
const T=()=>S.tasks.filter(x=>x.d===today());
const dy=()=>S.dy[today()]||{};
const surv=()=>Object.values(S.dy).filter(x=>x.cl).length;
function streak(){let c=0,d=new Date();if(!dy().cl)d.setDate(d.getDate()-1);while((S.dy[ds(d)]||{}).cl){c++;d.setDate(d.getDate()-1)}return c}
const ci=()=>S.ch>=0?S.ch:((diff(S.start,today())%5)+5)%5;
function rollover(){const lat={};S.tasks.forEach(x=>{if(!x.par){const k=x.src||x.id;if(!lat[k]||x.d>lat[k].d)lat[k]=x}});
 Object.values(lat).forEach(x=>{if(x.r&&x.d<today()){const id=Date.now()+Math.random().toString(36).slice(2,6);S.tasks.push({id,t:x.t,p:x.p,l:x.l,par:null,d:today(),done:0,r:1,src:x.src||x.id})}});save()}

/* 弹窗 */
function pop(a,say,b1,f1,b2,f2){$("pa").innerHTML=a;$("say").textContent=say;const c=f=>()=>{$("pop").classList.remove("on");f&&f()};$("p1").textContent=b1;$("p1").onclick=c(f1);$("p2").style.display=b2?"":"none";if(b2){$("p2").textContent=b2;$("p2").onclick=c(f2)}$("pop").classList.add("on")}
const unf=()=>T().filter(x=>!x.done).length;
const hiN=()=>T().filter(x=>x.p==3&&!x.done).length;
function notify(m){try{if(window.Notification&&Notification.permission==="granted")new Notification("守夜人",{body:m})}catch(e){}}
function morningPop(){const m="天亮了。先想清楚今天要做什么，再出门。"+(S.tasks.length?"":"空手进荒野可活不过今晚。");chime(ci(),1);pop(art("c"+ci()),m,"开始计划",()=>{tab=0;render();$("ti").focus()},"稍后");notify(m)}
function eveningPop(){const h=hiN();if(h){monster(h)}else{const m=`夜幕降临，已坚持 ${surv()} 天，还需 ${Math.max(0,S.total-surv())} 天。来清点今天的成果。`;chime(ci(),0);pop(art("c"+ci()),m,"入夜清点",closeDay,"稍后");notify(m)}}
function monster(h){growl();const k=h>=3?2:h==2?1:0,m=`夜袭！还有 ${h} 件重要事项没完成，它们循着气味来了。`;pop(art("m0"),m,"去应战",()=>{tab=0;render()});notify(m)}
function planDone(){if(!T().length){chime(ci(),0);return pop(art("c"+ci()),"一件事都没写？至少写一件，不然活不过今晚。","好吧")}S.dy[today()]=Object.assign(dy(),{pl:1});save();chime(ci(),1);pop(art("c"+ci()),"计划已定。火把别灭，天黑前见。","出发");render()}
function closeDay(){const h=hiN();if(h)return monster(h);S.dy[today()]=Object.assign(dy(),{cl:1});save();crackle();pop(art("c"+ci()),`你又活过了一天。已坚持 ${surv()} 天，还需 ${Math.max(0,S.total-surv())} 天。`,"晚安");render()}
function tick(){const n=hm(),d=dy();if(n>=S.tm&&n<S.te&&!d.pl&&S.lm!==today()){S.lm=today();save();morningPop()}if(n>=S.te&&!d.cl&&S.le!==today()){S.le=today();save();eveningPop()}}

/* 渲染 */
function row(x,sub){const f=flash==x.id;return`<div class="t ${sub?"s":""} ${x.done?"d":""} ${f?"fl":""}" data-id="${x.id}"><button class="cb" data-a="tg"></button><div class="tx">${esc(x.t)}${x.p?`<b class="pp p${x.p}">${"!".repeat(x.p)}</b>`:""}${x.r?" 🔁":""}</div>${sub?"":'<button class="mn" data-a="sub">＋</button>'}<button class="mn" data-a="del">×</button></div>`}
function today_(){const c=surv(),r=Math.max(0,S.total-c),d=dy(),eve=hm()>=S.te,ts=T();
 let ban=eve?(d.cl?"🌙 今夜已安然度过":`🌙 夜幕降临 · 未完成 ${unf()} 件`):(d.pl?"☀ 计划已定，去干活吧":"☀ 清晨 · 先写下今天的计划");
 let bt=eve&&!d.cl?'<button class="go" data-a="close">入夜清点</button>':(!eve&&!d.pl?'<button class="go" data-a="plan">计划完毕</button>':"");
 let h=`${scene()}<div class="card"><div class="big">第 ${Math.max(1,diff(S.start,today())+1)} 天</div><div class="sub">已坚持 <b>${c}</b> 天 · 还需 <b>${r}</b> 天</div><div class="rope"><i style="width:${Math.min(100,c/S.total*100)}%"></i></div><div class="row"><span>连续 ${streak()} 天</span><span>「${esc(S.goal)}」</span></div></div><div class="card ban"><span>${ban}</span>${bt}</div>`;
 if(!ts.length)h+=`<div class="empty">营地里空空如也。<br>在下方写下今天要做的事，选好优先级（!!! 最重要），<br>重要事项没完成，夜里怪物会来。</div>`;
 LS.forEach((l,i)=>{const ps=ts.filter(x=>x.l==i&&!x.par).sort((a,b)=>a.done-b.done||b.p-a.p);if(!ps.length)return;const all=ts.filter(x=>x.l==i);h+=`<h3><span>${l[0]} ${l[1]}</span><span>${all.filter(x=>x.done).length}/${all.length}</span></h3>`;ps.forEach(p=>{h+=row(p,0);ts.filter(x=>x.par==p.id).forEach(s=>h+=row(s,1))})});
 return h}
function camp(){const c=surv(),r=Math.max(0,S.total-c);let g="";for(let i=29;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);g+=`<i class="${(S.dy[ds(d)]||{}).cl?"on":""}"></i>`}
 const sl=Object.keys(NM).map(k=>`<div class="slot"><span>${NM[k]}</span><input type="file" accept="image/*" data-u="${k}">${S.im[k]?`<button data-a="rst" data-k="${k}">还原</button>`:""}</div>`).join("");
 return`<div class="card"><div class="big">${c} / ${S.total} 天</div><div class="sub">还需 <b>${r}</b> 天 · 连续 ${streak()} 天</div><div class="grid">${g}</div><div class="hint">近 30 天，亮起的是安然入夜的日子</div></div>
<div class="card"><label>目标名称<input data-k="goal" value="${esc(S.goal)}"></label><label>开始日期<input type="date" data-k="start" value="${S.start}"></label><label>总共坚持天数<input type="number" data-k="total" value="${S.total}"></label><label>早晨提醒（制定计划）<input type="time" data-k="tm" value="${S.tm}"></label><label>夜晚提醒（清点成果）<input type="time" data-k="te" value="${S.te}"></label><label>提醒角色<select data-k="ch"><option value="-1">每天轮换</option>${[0,1,2,3,4,5].map(i=>`<option value="${i}">${NM[CK(i)]}</option>`).join("")}</select></label></div>
<div class="card"><b>自定义立绘</b><div class="hint">可上传你自己的角色或怪物图片（建议透明底 PNG），仅保存在本机。</div>${sl}</div>
<div class="card"><button data-a="test0">试听早晨</button> <button data-a="test1">试听夜袭</button><div class="hint">网页版只有页面打开时才会弹出角色。锁屏或后台的提醒，请导入对话里的 reminders.ics 到 iPhone 日历，并用「添加到主屏幕」使用本页。</div></div>`}
function render(){$("bar").style.display=tab?"none":"flex";document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",+b.dataset.t==tab));$("app").innerHTML=tab?camp():today_();if(tab){const s=document.querySelector('select[data-k="ch"]');if(s)s.value=S.ch}flash=null;react="";updBar()}
function updBar(){$("bp").textContent=aP?"!".repeat(aP):"○";$("bp").className=aP?"p"+aP:"";$("bl").textContent=LS[aL][0];$("br").textContent=aR?"🔁":"·";$("bc").style.display=aPar?"":"none";$("bc").textContent="子任务 ✕"}

/* 角色互动 */
const TAG=["出发！","……慢慢来。","哼。","驾！","咩～","咔嚓！"];
const P=[["别戳啦，旗子要歪了！","我在整理行囊，马上出发！","再戳我就先去探路啦。"],["……嗯？我在听。","羽毛别拔，会痒。","慢一点，也能走到。"],["哼，轻点，鬃毛是梳过的。","本大爷在巡视，别打扰。","把正事做完，再来摸。"],["驾！朕的江山不等人。","朕的马可不是玩具！","时间不等人，爱卿。"],["咩～这片草不错。","背包里没吃的啦！","再戳，我就把你的计划啃掉。"],["咔嚓！想被吃掉吗？","我只吃拖延的人。","重要的事……做完了吗？"]];
function say(ctx,i){const c=surv(),r=Math.max(0,S.total-c),n=unf(),L={idle:n?`还有 ${n} 件事，一件一件来。`:"今天的活都干完了，歇会儿。",done:"又搞定一件！"+(n?`还剩 ${n} 件。`:"全部完成！"),add:"记下了，别想溜。",sad:"天快黑了，重要的事还没做完……",happy:"今天的火堆烧得旺旺的。"};return(L[ctx]||"")+" "+TAG[i]}
function scene(){const i=ci(),ts=T(),eve=hm()>=S.te,d=dy(),md=eve&&!d.cl&&hiN()?"sad":((ts.length&&!unf())||d.cl)?"happy":"";
 const ctx=react=="cheer"?"done":react=="nod"?"add":md||"idle";
 const sp=react=="cheer"?[0,1,2,3,4].map(k=>`<i class="sp" style="--x:${(k-2)*30}px;--d:${k*.07}s">✨</i>`).join(""):"";
 return`<div class="scene ${md} ${react}"><div class="buddy" data-a="poke">${art(i)}${sp}</div><div class="bub" id="bt">${say(ctx,i)}</div>${FIRE}</div>`}
function poke(){const i=ci(),sc=document.querySelector(".scene");if(!sc)return;ac();voice(i);sc.classList.remove("cheer","nod");void sc.offsetWidth;sc.classList.add("cheer");$("bt").textContent=P[i][Math.floor(Math.random()*3)]}
/* 交互 */
function add(){const v=$("ti").value.trim();if(!v)return;ac();const id=Date.now()+Math.random().toString(36).slice(2,6),pt=aPar&&S.tasks.find(x=>x.id==aPar);S.tasks.push({id,t:v,p:aP,l:pt?pt.l:aL,par:aPar,d:today(),done:0,r:aR&&!aPar?1:0,src:id});$("ti").value="";flash=id;react="nod";save();render()}
$("ba").onclick=add;$("ti").onkeydown=e=>{if(e.key==="Enter")add()};
$("bp").onclick=()=>{aP=(aP+1)%4;updBar()};$("bl").onclick=()=>{aL=(aL+1)%4;updBar()};$("br").onclick=()=>{aR=aR?0:1;updBar()};$("bc").onclick=()=>{aPar=null;updBar()};
$("tabs").onclick=e=>{const b=e.target.closest("[data-t]");if(!b)return;tab=+b.dataset.t;render();const a=$("app");a.classList.remove("sw");void a.offsetWidth;a.classList.add("sw");scrollTo(0,0)};
$("app").onclick=e=>{const b=e.target.closest("[data-a]");if(!b)return;ac();const a=b.dataset.a,r=b.closest("[data-id]"),id=r&&r.dataset.id;
 if(a=="tg"){const t=S.tasks.find(x=>x.id==id);t.done=t.done?0:1;if(t.done){tok();setTimeout(()=>voice(ci()),140);react="cheer"}flash=id}
 else if(a=="del"){S.tasks=S.tasks.filter(x=>x.id!=id&&x.par!=id)}
 else if(a=="sub"){aPar=id;$("ti").focus();updBar();return}
 else if(a=="poke")return poke();else if(a=="plan")return planDone();else if(a=="close")return closeDay();
 else if(a=="rst"){delete S.im[b.dataset.k]}
 else if(a=="test0")return morningPop();else if(a=="test1")return monster(2);
 save();render()};
$("app").onchange=e=>{const t=e.target,u=t.dataset.u;
 if(u&&t.files[0]){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,360/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);S.im[u]=c.toDataURL("image/png");save();render()};im.src=r.result};r.readAsDataURL(t.files[0]);return}
 const k=t.dataset.k;if(!k)return;let v=t.value;if(k=="total")v=Math.max(1,+v||100);if(k=="ch")v=+v;S[k]=v;S.lm=S.le="";save();try{window.Notification&&Notification.permission==="default"&&Notification.requestPermission()}catch(x){}render()};
rollover();render();tick();setInterval(tick,15000);
</script></body></html>
